name: Supabase keepalive

on:
  schedule:
    # Every 8 hours, at 06:17, 14:17, and 22:17 Asia/Dhaka (UTC+6).
    - cron: '17 */8 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Query the Supabase heartbeat table
        shell: bash
        env:
          SUPABASE_URL: https://xizhvfokbwpywdhmevcs.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo '::error::Add the SUPABASE_PUBLISHABLE_KEY Actions secret. See docs/supabase-keepalive.md.'
            exit 1
          fi

          response="$(curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 20 \
            --retry 2 --retry-delay 5 --retry-max-time 60 \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            --header 'Accept: application/json' \
            "$SUPABASE_URL/rest/v1/portfolio_heartbeat?select=id&id=eq.1&limit=1")"

          # An empty response can indicate missing seed data or an RLS policy.
          python3 -c 'import json, sys; data = json.load(sys.stdin); assert data == [{"id": 1}], "Heartbeat row unavailable; check SQL setup and RLS"' <<< "$response"
          echo 'Supabase database query succeeded.'
